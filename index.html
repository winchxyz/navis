<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
import Stats from 'three/addons/libs/stats.module.js';

/* ═══════════════════════════════════════════════════════════════════
   CONSTANTS — the whole art direction lives here, nothing is a setting
   ═══════════════════════════════════════════════════════════════════ */
const BAYS       = 7;
const BAY        = 6.4;
const NAVE_W     = 14;
const ARCADE_H   = 12;
const VAULT_H    = 21;
const WATER_Y    = 4.2;
const AISLE_W    = 5.0;
const Z0         = -24;                    // west facade (rose) plane
const Z1         = Z0 + BAYS * BAY;        // east end
const ROSE_C     = new THREE.Vector3(0, 15, Z0);
const ROSE_R     = 4.6;

const GLASS = {
  cobalt:   '#1e3f8f',
  ruby:     '#8e1622',
  emerald:  '#166b4c',
  amber:    '#c98a2e',
  manganese:'#4b2c6d',
  white:    '#e8d9b0'
};

const STONE_DRY = 0xb8ae9c;
const STONE_WET = 0x5a5449;

/* The breach. Sited in the middle of a web panel rather than on a rib,
   because the web is the thin part — that is what actually falls in.
   Everything else keyed off it: the daylight, the rain, the rubble. */
const BREACH = { x: -4.3, z: -7.4, r: 1.35 };
const breachRadius = (dx, dz) => {          // ragged, not a drilled circle
  const a = Math.atan2(dz, dx);
  return BREACH.r * (0.80 + 0.20 * Math.sin(a * 3.1 + 0.7)
                          + 0.10 * Math.sin(a * 7.3 + 2.1));
};
const inBreach = (x, z) => {
  const dx = x - BREACH.x, dz = z - BREACH.z;
  return dx * dx + dz * dz < Math.pow(breachRadius(dx, dz), 2);
};

const RENDER_LAYER = 0;   // everything
const REFLECT_LAYER = 1;  // cheap subset drawn into the mirror
const WATER_LAYER  = 2;   // drawn last, so it can refract what is behind it

/* ═══════════════════════════════════════════════════════════════════
   RENDERER / SCENE / CAMERA
   ═══════════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a2836, 0.0);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 220);
camera.position.set(0, 4.4, 14);

const hemi = new THREE.HemisphereLight(0x2a3348, 0x1a1512, 0.35);
scene.add(hemi);

// shared clock-driven uniform, handed to every custom material
const uTime = { value: 0 };

/* The four Gerstner waves, in one place. The GLSL constants are written
   out of this array, so anything floating on the surface is solving the
   same equation the vertex shader does — no drift between them.     */
const WAVES = [
  [ 0.92,  0.39, 8.0, 0.055],
  [-0.41,  0.91, 5.1, 0.038],
  [ 0.71, -0.70, 2.9, 0.021],
  [-0.86, -0.51, 1.8, 0.011]
];
const WAVE_GLSL = WAVES
  .map((w, i) => `const vec4 W${i} = vec4(${w.map(v => v.toFixed(3)).join(', ')});`)
  .join('\n    ');

// height and slope of the surface at a world point — for floating things
const waveAt = (() => {
  const G = 9.81;
  return (x, z, t, ampMul = 1, steepMul = 1) => {
    let y = 0, nx = 0, nz = 0;
    for (const [dx, dz, len, amp0] of WAVES) {
      const l = Math.hypot(dx, dz), ux = dx / l, uz = dz / l;
      const k = (Math.PI * 2) / len, a = amp0 * ampMul;
      const om = Math.sqrt(G * k);
      const ph = k * (ux * x + uz * z) - om * t;
      y += a * Math.sin(ph);
      const wa = k * a;
      nx -= ux * wa * Math.cos(ph);
      nz -= uz * wa * Math.cos(ph);
    }
    return { y, nx, nz };
  };
})();

/* ═══════════════════════════════════════════════════════════════════
   TEXTURES — everything drawn to a canvas once, at load
   ═══════════════════════════════════════════════════════════════════ */
function makeCanvas(s) {
  const c = document.createElement('canvas');
  c.width = c.height = s;
  return c;
}
function blurCanvas(src, px) {
  const out = makeCanvas(src.width);
  const g = out.getContext('2d');
  g.filter = `blur(${px}px)`;
  g.drawImage(src, 0, 0);
  return out;
}

/* ── 1. The rose window ────────────────────────────────────────────
   12-fold radial symmetry. Oculus, trefoils, lancets, outer rosettes.
   Mullions in black; the black surround is what makes the shafts
   read as separate beams instead of one cone of light.            */
function makeRoseTexture() {
  const S = 2048, R = S / 2, cv = makeCanvas(S), g = cv.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
  g.translate(R, R);

  const petalOf = i => {                     // 12 sectors, ruby+amber aimed low
    const a = (i / 12) * Math.PI * 2 - Math.PI / 2;   // sector direction
    const down = Math.sin(a);                          // +1 = straight down
    if (down > 0.55) return GLASS.ruby;
    if (down > 0.10) return i & 1 ? GLASS.amber : GLASS.ruby;
    if (down > -0.45) return i & 1 ? GLASS.cobalt : GLASS.emerald;
    return i & 1 ? GLASS.cobalt : GLASS.manganese;
  };

  const wedge = (r0, r1, a0, a1, fill) => {
    g.beginPath();
    g.arc(0, 0, r1, a0, a1);
    g.arc(0, 0, r0, a1, a0, true);
    g.closePath();
    g.fillStyle = fill; g.fill();
  };
  const disc = (x, y, r, fill) => {
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = fill; g.fill();
  };
  const ring = (r, w) => {
    g.beginPath(); g.arc(0, 0, r, 0, 7);
    g.lineWidth = w; g.strokeStyle = '#000'; g.stroke();
  };

  /* glass field, drawn outward: oculus → lancets → trefoils → rosettes.
     The oculus stays warm rather than pale on purpose. Light through
     the centre of the window is what lands in the middle of the floor,
     and pale glass there projects a white disc that reads as a lamp
     lying in the water instead of a patch of coloured light.       */
  disc(0, 0, 0.175 * R, GLASS.amber);
  for (let i = 0; i < 6; i++) {                     // oculus flower
    const a = i / 6 * Math.PI * 2;
    disc(Math.cos(a) * 0.095 * R, Math.sin(a) * 0.095 * R, 0.048 * R, '#a8641f');
  }
  disc(0, 0, 0.05 * R, GLASS.ruby);

  const TAU = Math.PI * 2;
  for (let i = 0; i < 12; i++) {
    const a0 = (i / 12) * TAU - Math.PI / 2, a1 = a0 + TAU / 12;
    const mid = (a0 + a1) / 2;
    const col = petalOf(i);

    // lancet band
    wedge(0.20 * R, 0.455 * R, a0 + 0.012, a1 - 0.012, col);
    wedge(0.20 * R, 0.26 * R, a0 + 0.012, a1 - 0.012, GLASS.white);

    // trefoil, three lobes on a circle
    const tx = Math.cos(mid) * 0.585 * R, ty = Math.sin(mid) * 0.585 * R;
    const tc = i % 3 === 0 ? GLASS.emerald : (petalOf(i) === GLASS.ruby ? GLASS.amber : GLASS.ruby);
    disc(tx, ty, 0.105 * R, col === GLASS.cobalt ? GLASS.cobalt : GLASS.manganese);
    for (let k = 0; k < 3; k++) {
      const a = mid + k / 3 * TAU + Math.PI / 6;
      disc(tx + Math.cos(a) * 0.052 * R, ty + Math.sin(a) * 0.052 * R, 0.05 * R, tc);
    }

    // outer band + two rosettes per sector
    wedge(0.70 * R, 0.845 * R, a0 + 0.014, a1 - 0.014, i & 1 ? GLASS.cobalt : col);
    for (let k = 0; k < 2; k++) {
      const a = a0 + (k + 0.5) * (TAU / 24);
      disc(Math.cos(a) * 0.775 * R, Math.sin(a) * 0.775 * R, 0.048 * R,
           k ? GLASS.amber : GLASS.white);
    }
  }

  // stone: radial mullions, concentric rings, outer wall
  g.lineCap = 'butt';
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * TAU - Math.PI / 2;
    g.save(); g.rotate(a);
    g.fillStyle = '#000';
    g.fillRect(0.16 * R, -0.0125 * R, 0.70 * R, 0.025 * R);
    g.restore();
  }
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * TAU - Math.PI / 2 + TAU / 48;
    g.save(); g.rotate(a);
    g.fillStyle = '#000';
    g.fillRect(0.68 * R, -0.008 * R, 0.19 * R, 0.016 * R);
    g.restore();
  }
  ring(0.185 * R, 0.030 * R);
  ring(0.20 * R, 0.016 * R);
  ring(0.462 * R, 0.026 * R);
  ring(0.70 * R, 0.024 * R);
  ring(0.855 * R, 0.05 * R);

  g.globalCompositeOperation = 'destination-in';     // kill everything outside
  g.beginPath(); g.arc(0, 0, 0.87 * R, 0, 7); g.fill();
  g.globalCompositeOperation = 'source-over';

  const tex = new THREE.CanvasTexture(blurCanvas(cv, 2));
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

/* ── 2. Caustics ───────────────────────────────────────────────────
   Three tileable Voronoi layers multiplied. The F2−F1 ridge term is
   what gives the thin filaments; the F1 blob alone reads as bubbles. */
function makeCausticsTexture() {
  const S = 512, cv = makeCanvas(S), g = cv.getContext('2d');
  const img = g.createImageData(S, S), d = img.data;
  const hash = (x, y, s) => {
    let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = (h ^ (h >> 13)) * 1274126177 | 0;
    return ((h ^ (h >> 16)) >>> 0) / 4294967296;
  };
  const layer = (u, v, n, seed) => {           // n cells per axis → tiles
    const fx = u * n, fy = v * n;
    const ix = Math.floor(fx), iy = Math.floor(fy);
    let f1 = 9, f2 = 9;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const cx = ix + ox, cy = iy + oy;
      const wx = ((cx % n) + n) % n, wy = ((cy % n) + n) % n;
      const px = cx + hash(wx, wy, seed), py = cy + hash(wx, wy, seed + 17);
      const dx = px - fx, dy = py - fy, dd = Math.sqrt(dx * dx + dy * dy);
      if (dd < f1) { f2 = f1; f1 = dd; } else if (dd < f2) { f2 = dd; }
    }
    const ridge = 1 - Math.min(1, (f2 - f1) * 7.0);   // thin bright web
    const blob  = Math.max(0, 1 - f1 * 1.35);
    return Math.min(1, ridge * 0.85 + blob * 0.45);
  };
  const buf = new Float32Array(S * S);
  let max = 0;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S;
    const c = layer(u, v, 6, 1) * layer(u, v, 10, 2) * layer(u, v, 17, 3);
    buf[y * S + x] = c;
    if (c > max) max = c;
  }
  // the product of three layers is nearly black on average; lift it so
  // the shader's own pow() still has something to work with
  for (let i = 0; i < S * S; i++) {
    const v = Math.min(255, Math.pow(buf[i] / max, 0.45) * 255) | 0;
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(blurCanvas(cv, 1));
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.NoColorSpace;
  return tex;
}

/* ── 3. Stone: three octaves of tileable value noise → normal map ── */
function makeStoneNormal() {
  const S = 512, cv = makeCanvas(S), g = cv.getContext('2d');
  const img = g.createImageData(S, S), d = img.data;
  const h2 = (x, y, s) => {
    let h = (x * 1597334677 + y * 3812015801 + s * 982451653) | 0;
    h = (h ^ (h >> 15)) * 2246822519 | 0;
    return ((h ^ (h >> 13)) >>> 0) / 4294967296;
  };
  const sm = t => t * t * (3 - 2 * t);
  const vnoise = (u, v, n, s) => {
    const fx = u * n, fy = v * n;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = sm(fx - x0), ty = sm(fy - y0);
    const w = (a, b) => h2(((a % n) + n) % n, ((b % n) + n) % n, s);
    return (w(x0, y0) * (1 - tx) + w(x0 + 1, y0) * tx) * (1 - ty)
         + (w(x0, y0 + 1) * (1 - tx) + w(x0 + 1, y0 + 1) * tx) * ty;
  };
  const field = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S;
    field[y * S + x] = vnoise(u, v, 8, 1) * 0.6 + vnoise(u, v, 24, 2) * 0.28
                     + vnoise(u, v, 71, 3) * 0.12;
  }
  const at = (x, y) => field[(((y % S) + S) % S) * S + (((x % S) + S) % S)];
  const st = 2.2;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = (at(x + 1, y) - at(x - 1, y)) * st;
    const dy = (at(x, y + 1) - at(x, y - 1)) * st;
    const l = Math.hypot(dx, dy, 1), i = (y * S + x) * 4;
    d[i]     = ((-dx / l) * 0.5 + 0.5) * 255;
    d[i + 1] = ((-dy / l) * 0.5 + 0.5) * 255;
    d[i + 2] = ((1 / l) * 0.5 + 0.5) * 255;
    d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.NoColorSpace;
  return tex;
}

/* ── 3b. Lancet windows ────────────────────────────────────────────
   The rose is the key light; these are the side fill. Same rules as
   the rose: stone in black, glass from the palette, nothing saturated.
   Two lights under a pointed head, a quarry field of leaded diamonds,
   a coloured medallion in each light, borders top and bottom.     */
function makeLancetTexture(W, H, pal, seed = 0) {
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  let rs = seed * 9301 + 49297;
  const rnd = () => (rs = (rs * 9301 + 49297) % 233280) / 233280;

  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);

  // the opening: a two-centre arch over a rectangle
  const m = W * 0.045, w = W - m * 2, x0 = m, x1 = W - m;
  const spring = H * 0.40, headTop = H * 0.018;
  const arch = (inset) => {
    const a = x0 + inset, b = x1 - inset, hw = (b - a) / 2, cx = (a + b) / 2;
    const rise = spring - headTop - inset;
    const e = Math.max(0.01, (rise * rise - hw * hw) / (2 * hw)), R = hw + e;
    // canvas y grows downward, so the apex is at a negative angle
    g.beginPath();
    g.moveTo(a, H - m + inset);
    g.lineTo(a, spring);
    g.arc(cx + e, spring, R, Math.PI, Math.atan2(-rise, -e), false);
    g.arc(cx - e, spring, R, Math.atan2(-rise, e), 0, false);
    g.lineTo(b, H - m + inset);
    g.closePath();
  };

  arch(0); g.fillStyle = pal.field; g.fill();

  // leaded quarry field: diamonds on the diagonal, faintly varied
  g.save(); arch(W * 0.045); g.clip();
  const q = W * 0.115;
  for (let y = -q; y < H + q; y += q) for (let x = -q; x < W + q; x += q) {
    g.beginPath();
    g.moveTo(x, y - q / 2); g.lineTo(x + q / 2, y);
    g.lineTo(x, y + q / 2); g.lineTo(x - q / 2, y);
    g.closePath();
    g.fillStyle = rnd() < 0.16 ? pal.accent : (rnd() < 0.5 ? pal.field : pal.field2);
    g.fill();
    g.lineWidth = W * 0.008; g.strokeStyle = 'rgba(0,0,0,.62)'; g.stroke();
  }
  // a medallion in each of the two lights
  for (let k = 0; k < 2; k++) {
    const cx = W * (k ? 0.655 : 0.345), cy = H * 0.66, r = W * 0.135;
    g.beginPath(); g.arc(cx, cy, r, 0, 7);
    g.fillStyle = pal.medal; g.fill();
    g.lineWidth = W * 0.026; g.strokeStyle = '#000'; g.stroke();
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * Math.PI * 2 + 0.78;
      g.beginPath();
      g.arc(cx + Math.cos(a) * r * 0.46, cy + Math.sin(a) * r * 0.46, r * 0.34, 0, 7);
      g.fillStyle = i & 1 ? pal.accent : pal.hot; g.fill();
    }
    g.beginPath(); g.arc(cx, cy, r * 0.26, 0, 7);
    g.fillStyle = pal.hot; g.fill();
  }
  // trefoil in the head
  for (let i = 0; i < 3; i++) {
    const a = i / 3 * Math.PI * 2 - Math.PI / 2;
    g.beginPath();
    g.arc(W * 0.5 + Math.cos(a) * W * 0.085, H * 0.235 + Math.sin(a) * W * 0.085, W * 0.078, 0, 7);
    g.fillStyle = i === 0 ? pal.hot : pal.accent; g.fill();
  }
  // banded borders top and bottom
  g.fillStyle = pal.band;
  g.fillRect(x0, H * 0.86, w, H * 0.045);
  g.fillRect(x0, H * 0.505, w, H * 0.028);
  g.restore();

  // stone: central mullion, transom, and the outer reveal
  g.fillStyle = '#000';
  g.fillRect(W * 0.478, H * 0.30, W * 0.044, H * 0.70);
  g.fillRect(x0, H * 0.845, w, H * 0.016);
  g.lineWidth = W * 0.075; g.strokeStyle = '#000';
  arch(0); g.stroke();
  g.lineWidth = W * 0.022;
  arch(W * 0.045); g.stroke();

  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const go = out.getContext('2d');
  go.filter = 'blur(1.1px)';
  go.drawImage(cv, 0, 0);
  const tex = new THREE.CanvasTexture(out);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

/* ── 4. Marble ─────────────────────────────────────────────────────
   Domain-warped turbulence pushed through a sine, which is the classic
   way to get calcite veining: the sine's zero crossings become the
   veins and the warp makes them wander. Two vein families at different
   angles, a broad tone underneath, fine speckle on top. Everything is
   built on a wrapped lattice, so all three maps tile.
   One field pass feeds albedo, roughness and normal.               */
function marbleSampler(seed, o = {}) {
  /* Real marble is mostly field with soft, wide veining. Narrow bright
     filaments are what make procedural marble look like cracked glass,
     so the calcite sits close to the base value and the character comes
     from the darker seams instead.                                  */
  const base  = o.base  || [0.800, 0.766, 0.700];
  const shade = o.shade || [0.632, 0.594, 0.523];
  const vein  = o.vein  || [0.852, 0.836, 0.790];
  const dark  = o.dark  || [0.398, 0.368, 0.318];
  const warp  = o.warp ?? 0.30;
  const amt   = o.veinAmt ?? 0.55;

  const hash = (x, y, s) => {
    let h = (x * 1597334677 + y * 3812015801 + s * 982451653) | 0;
    h = (h ^ (h >> 15)) * 2246822519 | 0;
    return ((h ^ (h >> 13)) >>> 0) / 4294967296;
  };
  const sm = t => t * t * (3 - 2 * t);
  const vn = (u, v, n, s) => {
    const fx = u * n, fy = v * n;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = sm(fx - x0), ty = sm(fy - y0);
    const w = (a, b) => hash(((a % n) + n) % n, ((b % n) + n) % n, s);
    return (w(x0, y0) * (1 - tx) + w(x0 + 1, y0) * tx) * (1 - ty)
         + (w(x0, y0 + 1) * (1 - tx) + w(x0 + 1, y0 + 1) * tx) * ty;
  };
  const fbm = (u, v, n, s, oct) => {
    let a = 0.5, f = n, sum = 0, norm = 0;
    for (let i = 0; i < oct; i++) { sum += a * vn(u, v, f, s + i * 37); norm += a; a *= 0.5; f *= 2; }
    return sum / norm;
  };
  const TAU = Math.PI * 2;

  // integer coefficients on u and v keep the sine periodic → seamless
  return (u, v) => {
    const wx = u + (fbm(u, v, 3, seed, 4) - 0.5) * warp;
    const wy = v + (fbm(u, v, 3, seed + 101, 4) - 0.5) * warp;
    const t = fbm(wx, wy, 4, seed + 7, 5);
    const s1 = Math.sin(TAU * (3 * wx + 1 * wy + t * 2.30));
    const s2 = Math.sin(TAU * (1 * wx - 2 * wy + t * 1.55) + 1.7);
    // wide, soft veins read as marble; thin bright filaments read as
    // lightning the moment the surface is over-lit
    const v1 = Math.pow(1 - Math.abs(s1), 2.2);        // calcite, broad
    const v2 = Math.pow(1 - Math.abs(s2), 7.0);        // dark seams
    const broad = fbm(u, v, 2, seed + 55, 3);
    const grain = fbm(u, v, 48, seed + 71, 2) - 0.5;

    const c = [0, 0, 0];
    for (let i = 0; i < 3; i++) {
      let x = shade[i] + (base[i] - shade[i]) * broad;
      x += (dark[i] - x) * v2 * amt * 0.82;
      x += (vein[i] - x) * v1 * amt;
      c[i] = Math.max(0, Math.min(1, x + grain * 0.055));
    }
    // polished stone: the veins take a slightly better polish
    const rough = Math.max(0.05, Math.min(1,
      0.62 + (broad - 0.5) * 0.20 - v1 * 0.16 + v2 * 0.10 + grain * 0.06));
    const height = broad * 0.55 + v1 * 0.40 - v2 * 0.55 + grain * 0.35;
    return { r: c[0], g: c[1], b: c[2], rough, height };
  };
}

function makeMarbleMaps(S, seed, opts) {
  const sample = marbleSampler(seed, opts);
  const alb = makeCanvas(S), rgh = makeCanvas(S), nrm = makeCanvas(S);
  const ga = alb.getContext('2d'), gr = rgh.getContext('2d'), gn = nrm.getContext('2d');
  const ia = ga.createImageData(S, S), ir = gr.createImageData(S, S), inr = gn.createImageData(S, S);
  const H = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const s = sample(x / S, y / S), i = (y * S + x) * 4;
    ia.data[i] = s.r * 255; ia.data[i + 1] = s.g * 255; ia.data[i + 2] = s.b * 255; ia.data[i + 3] = 255;
    const q = s.rough * 255;
    ir.data[i] = ir.data[i + 1] = ir.data[i + 2] = q; ir.data[i + 3] = 255;
    H[y * S + x] = s.height;
  }
  const at = (x, y) => H[(((y % S) + S) % S) * S + (((x % S) + S) % S)];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = (at(x + 1, y) - at(x - 1, y)) * 2.6;
    const dy = (at(x, y + 1) - at(x, y - 1)) * 2.6;
    const l = Math.hypot(dx, dy, 1), i = (y * S + x) * 4;
    inr.data[i] = ((-dx / l) * 0.5 + 0.5) * 255;
    inr.data[i + 1] = ((-dy / l) * 0.5 + 0.5) * 255;
    inr.data[i + 2] = ((1 / l) * 0.5 + 0.5) * 255;
    inr.data[i + 3] = 255;
  }
  ga.putImageData(ia, 0, 0); gr.putImageData(ir, 0, 0); gn.putImageData(inr, 0, 0);

  const tex = (cv, srgb) => {
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.anisotropy = 8;
    return t;
  };
  return { albedo: tex(alb, true), rough: tex(rgh, false), normal: tex(nrm, false) };
}

/* ── 5. Floor: marble checkerboard, two stones, one 2×2 tile ─────── */
function makeFloorTexture() {
  const S = 512, cv = makeCanvas(S), g = cv.getContext('2d');
  const img = g.createImageData(S, S), d = img.data, h = S / 2;
  // two stones cut from the same quarry: a pale and a near-black marble
  const pale = marbleSampler(21, {
    base: [0.700, 0.668, 0.607], shade: [0.545, 0.515, 0.458],
    vein: [0.815, 0.795, 0.742], dark: [0.352, 0.330, 0.290],
    warp: 0.26, veinAmt: 0.52
  });
  const dk = marbleSampler(34, {
    base: [0.268, 0.258, 0.243], shade: [0.176, 0.172, 0.168],
    vein: [0.455, 0.446, 0.420], dark: [0.108, 0.108, 0.112],
    warp: 0.34, veinAmt: 0.55
  });
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const cx = x < h ? 0 : 1, cy = y < h ? 0 : 1;
    // each tile samples its own patch of stone, so no two repeat
    const u = ((x % h) / h) * 0.5 + cx * 0.31, v = ((y % h) / h) * 0.5 + cy * 0.47;
    const s = ((cx + cy) & 1) ? pale(u, v) : dk(u, v);
    const e = Math.min(x % h, y % h, h - 1 - (x % h), h - 1 - (y % h));
    const joint = e < 3 ? 0.52 + e * 0.16 : 1.0;      // cut joints between slabs
    const i = (y * S + x) * 4;
    d[i] = s.r * 255 * joint; d[i + 1] = s.g * 255 * joint; d[i + 2] = s.b * 255 * joint;
    d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

/* ═══════════════════════════════════════════════════════════════════
   STONE MATERIAL — waterline darkening + caustics, injected into
   MeshStandardMaterial. The caustic tint is read back out of the rose
   projection, so a ruby shaft lays down ruby caustics.
   ═══════════════════════════════════════════════════════════════════ */
const proj = {
  uSpotMat:    { value: new THREE.Matrix4() },
  uSpotMap:    { value: roseTex },
  uSpotShadow: { value: null },
  uCaustics:   { value: causticsTex },
  uWaterY:     { value: WATER_Y },
  uCaustic:    { value: new THREE.Vector3(2.2, 1.0, 1.0) },  // gain, scale, speed
  /* Caustics on stone are additive, so they have to be tied to how
     bright the rose actually is. Left as a constant they survived the
     light being turned off entirely and read as a lamp lying on the
     floor — a hard-edged pool that no light in the scene was casting. */
  uCaustMul:   { value: 1.1 },
  uWetRough:   { value: 0.52 },
  uMarble:     { value: marble.albedo },
  uMarbleR:    { value: marble.rough },
  uMarbleN:    { value: marble.normal },
  uStone:      { value: new THREE.Vector3(0.28, 1.0, 0.35) }, // scale, rough ×, relief
  uTime
};

const PROJ_PARS = /* glsl */`
  uniform mat4      uSpotMat;
  uniform sampler2D uSpotMap;
  uniform sampler2D uSpotShadow;
  uniform sampler2D uCaustics;
  uniform sampler2D uMarble;
  uniform sampler2D uMarbleR;
  uniform sampler2D uMarbleN;
  uniform float     uWaterY;
  uniform vec3      uCaustic;
  uniform vec3      uStone;
  uniform float     uCaustMul;
  uniform float     uWetRough;
  uniform float     uTime;
  varying vec3 vWPos;
  varying vec3 vWNrm;

  /* Triplanar, in world space. The building mixes lathes, extrusions and
     tube geometry, whose UVs are in three different conventions — mapping
     the marble off those would stretch it differently on every part.
     Projected from world coordinates the veining is continuous from the
     floor up a column and across a rib.                              */
  vec3 triplanar(sampler2D tex, vec3 wp, vec3 n, float sc) {
    vec3 b = abs(n); b = b * b * b;
    b /= max(b.x + b.y + b.z, 1e-4);
    vec3 c = vec3(0.0);
    if (b.x > 0.004) c += texture2D(tex, wp.zy * sc).rgb * b.x;
    if (b.y > 0.004) c += texture2D(tex, wp.xz * sc).rgb * b.y;
    if (b.z > 0.004) c += texture2D(tex, wp.xy * sc).rgb * b.z;
    return c;
  }

  /* The relief has to be projected the same way the colour is. Sampling
     it off the mesh UVs instead put the bumps somewhere else entirely,
     and at grazing angles the mismatch lit up as glowing cracks.
     Whiteout blend: fold the geometric normal into each projection
     before mixing, so the result stays stable on curved surfaces.  */
  vec3 triplanarNormal(sampler2D tex, vec3 wp, vec3 n, float sc, float amt) {
    vec3 b = abs(n); b = b * b * b;
    b /= max(b.x + b.y + b.z, 1e-4);
    vec3 nx = texture2D(tex, wp.zy * sc).xyz * 2.0 - 1.0;
    vec3 ny = texture2D(tex, wp.xz * sc).xyz * 2.0 - 1.0;
    vec3 nz = texture2D(tex, wp.xy * sc).xyz * 2.0 - 1.0;
    nx.xy *= amt; ny.xy *= amt; nz.xy *= amt;
    nx = vec3(nx.xy + n.zy, abs(nx.z) * n.x);
    ny = vec3(ny.xy + n.xz, abs(ny.z) * n.y);
    nz = vec3(nz.xy + n.xy, abs(nz.z) * n.z);
    return normalize(nx.zyx * b.x + ny.xzy * b.y + nz.xyz * b.z);
  }

  // colour of the rose projection at a world point, already occluded
  vec3 roseAt(vec3 wp) {
    vec4 sp = uSpotMat * vec4(wp, 1.0);
    if (sp.w <= 0.0) return vec3(0.0);
    vec3 c = sp.xyz / sp.w;
    if (any(lessThan(c.xy, vec2(0.001))) || any(greaterThan(c.xy, vec2(0.999)))) return vec3(0.0);
    float sd  = unpackRGBAToDepth(texture2D(uSpotShadow, c.xy));
    float vis = step(c.z - 0.0022, sd);
    return texture2D(uSpotMap, c.xy).rgb * vis;
  }

  // two scrolling layers so the pattern never visibly loops
  float causticAmp(vec2 wxz) {
    float t = uTime * uCaustic.z;
    vec2 s = wxz * uCaustic.y;
    float c = texture2D(uCaustics, s * 0.25 + t * vec2( 0.014, 0.009)).r
            * texture2D(uCaustics, s * 0.41 - t * vec2( 0.011, 0.017)).r;
    return pow(c, 0.75) * uCaustic.x;   // two dark layers multiplied: lift, don't crush
  }

  // clamped to below the surface and to upward-facing normals, or it
  // crawls up the columns
  vec3 causticLight(vec3 wp, vec3 wn) {
    float below = smoothstep(0.0, 0.45, uWaterY - wp.y);
    float up    = smoothstep(0.05, 0.55, wn.y);
    if (below * up <= 0.001) return vec3(0.0);
    float depthFade = exp(-(uWaterY - wp.y) * 0.30);
    return causticAmp(wp.xz) * roseAt(wp) * (below * up * depthFade);
  }
`;

const PROJ_VERT = /* glsl */`
  varying vec3 vWPos;
  varying vec3 vWNrm;
`;

function injectStone(mat, { caustics = true, marble = false } = {}) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, proj);
    sh.vertexShader = PROJ_VERT + sh.vertexShader;
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', /* glsl */`
      #include <project_vertex>
      vec4 wp4 = vec4(transformed, 1.0);
      vec3 wn3 = objectNormal;
      #ifdef USE_INSTANCING
        wp4 = instanceMatrix * wp4;
        wn3 = mat3(instanceMatrix) * wn3;
      #endif
      vWPos = (modelMatrix * wp4).xyz;
      vWNrm = normalize(mat3(modelMatrix) * wn3);
    `);
    // after <packing>, so unpackRGBAToDepth is already declared
    sh.fragmentShader = sh.fragmentShader.replace('void main() {', PROJ_PARS + '\nvoid main() {');
    sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>', /* glsl */`
      #include <map_fragment>
      ${marble ? 'diffuseColor.rgb *= triplanar(uMarble, vWPos, normalize(vWNrm), uStone.x);' : ''}
      float wet = 1.0 - smoothstep(uWaterY - 0.30, uWaterY + 0.40, vWPos.y);
      float tide = exp(-pow((vWPos.y - uWaterY - 0.22) * 5.5, 2.0));
      diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(0.40,0.42,0.40), wet);
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.085,0.098,0.070), tide * 0.55);
    `);
    if (marble) {
      sh.fragmentShader = sh.fragmentShader.replace('#include <normal_fragment_maps>', /* glsl */`
        #include <normal_fragment_maps>
        {
          vec3 wn = triplanarNormal(uMarbleN, vWPos, normalize(vWNrm), uStone.x, uStone.z);
          normal = normalize((viewMatrix * vec4(wn, 0.0)).xyz);
        }
      `);
    }
    sh.fragmentShader = sh.fragmentShader.replace('#include <roughnessmap_fragment>', /* glsl */`
      #include <roughnessmap_fragment>
      ${marble ? 'roughnessFactor *= triplanar(uMarbleR, vWPos, normalize(vWNrm), uStone.x).r * uStone.y;' : ''}
      /* Submerged stone is smoother than dry stone, but at 0.25 the
         floor was a mirror: the specular lobe of the rose collapsed
         into a hard-edged disc some seventy times brighter than the
         diffuse floor around it, which is what read as a lamp lying in
         the water. The highlight is real — it just has to be spread. */
      roughnessFactor = mix(roughnessFactor, uWetRough, wet);
    `);
    if (caustics) {
      sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>', /* glsl */`
        #include <opaque_fragment>
        gl_FragColor.rgb += causticLight(vWPos, normalize(vWNrm)) * diffuseColor.rgb * uCaustMul;
      `);
    }
  };
  mat.customProgramCacheKey = () => 'navis-stone' + (caustics ? '-c' : '') + (marble ? '-m' : '');
  return mat;
}

/* ═══════════════════════════════════════════════════════════════════
   GEOMETRY — clustered columns and pointed arches
   ═══════════════════════════════════════════════════════════════════ */
const SPRING    = 8.3;                    // arch springing height
const RISEK     = 1.15;                   // pointed-arch rise coefficient
const ARCH_SPAN = 5.3;                    // clear opening between columns
const WALL_TOP  = 15.5;                   // where the vault springs

function clusteredColumnGeometry() {
  const p = [
    [0.00, 0.00], [0.98, 0.00], [0.98, 0.30], [0.86, 0.42], [0.70, 0.70],
    [0.62, 1.05], [0.57, 1.60], [0.55, 7.30], [0.60, 7.50], [0.78, 7.95],
    [0.92, 8.16], [0.92, 8.30], [0.72, 8.44], [0.72, 8.62], [0.00, 8.62]
  ].map(([x, y]) => new THREE.Vector2(x, y));
  const parts = [new THREE.LatheGeometry(p, 20)];
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const h = 6.35;
    const g = new THREE.CylinderGeometry(0.175, 0.175, h, 8, 1);
    g.translate(0, 1.15 + h / 2, 0);
    g.rotateY(-a);
    g.translate(Math.cos(a) * 0.66, 0, Math.sin(a) * 0.66);
    parts.push(g);
    const cap = new THREE.CylinderGeometry(0.26, 0.20, 0.55, 8, 1);
    cap.translate(Math.cos(a) * 0.70, 7.78, Math.sin(a) * 0.70);
    parts.push(cap);
    const bs = new THREE.CylinderGeometry(0.24, 0.30, 0.55, 8, 1);
    bs.translate(Math.cos(a) * 0.70, 0.88, Math.sin(a) * 0.70);
    parts.push(bs);
  }
  const geo = mergeGeometries(parts, false);
  geo.computeVertexNormals();
  return geo;
}

/* two-centre pointed arch: solve the offset that puts the apex at
   RISEK × half-span, then trace intrados and extrados                */
function pointedArchShape(span, thick, riseK = RISEK) {
  const h = span / 2;
  const rise = riseK * h;
  const e  = (rise * rise - h * h) / (2 * h);     // centre offset
  const R  = h + e;
  const aL = Math.atan2(rise, -e);                // apex angle, left centre
  const aR = Math.atan2(rise,  e);                // apex angle, right centre
  const s = new THREE.Shape();
  s.moveTo(-h, 0);
  s.absarc( e, 0, R, Math.PI, aL, true);
  s.absarc(-e, 0, R, aR, 0, true);
  s.lineTo(h + thick, 0);
  s.absarc(-e, 0, R + thick, 0, aR, false);
  s.absarc( e, 0, R + thick, aL, Math.PI, false);
  s.lineTo(-h, 0);
  return { shape: s, rise, apex: rise };
}

function archGeometry(span, thick, depth) {
  const { shape } = pointedArchShape(span, thick);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05,
    bevelSegments: 1, curveSegments: 22
  });
  g.translate(0, 0, -depth / 2);
  return g;
}

/* ═══════════════════════════════════════════════════════════════════
   WALLS, FACADE, FLOOR
   ═══════════════════════════════════════════════════════════════════ */
function lancetPath(cx, base, spring, span, riseK = RISEK) {
  const h = span / 2, rise = riseK * h;
  const e = (rise * rise - h * h) / (2 * h), R = h + e;
  const aL = Math.atan2(rise, -e), aR = Math.atan2(rise, e);
  const p = new THREE.Path();
  p.moveTo(cx - h, base);
  p.lineTo(cx - h, spring);
  p.absarc(cx + e, spring, R, Math.PI, aL, true);
  p.absarc(cx - e, spring, R, aR, 0, true);
  p.lineTo(cx + h, base);
  p.closePath();
  return p;
}

function slabGeo(x0, x1, y0, y1, holes, depth) {
  const s = new THREE.Shape();
  s.moveTo(x0, y0); s.lineTo(x1, y0); s.lineTo(x1, y1); s.lineTo(x0, y1); s.closePath();
  s.holes = holes;
  return new THREE.ExtrudeGeometry(s, {
    depth, bevelEnabled: false, curveSegments: 20
  });
}

let roseDisc;
const glassOf = (map, bright) => new THREE.MeshBasicMaterial({
  map, color: new THREE.Color().setScalar(bright),
  toneMapped: true, fog: false, side: THREE.DoubleSide
});

/* ShapeGeometry hands back UVs in shape coordinates, which here span the
   whole wall. Remap each window onto its own 0..1 so the glass texture
   lands once per opening instead of once per bay run.               */
function glassPane(cx, base, spring, span) {
  const g = new THREE.ShapeGeometry(
    new THREE.Shape(lancetPath(cx, base, spring, span).getPoints(30)));
  g.computeBoundingBox();
  const bb = g.boundingBox, uv = g.attributes.uv, p = g.attributes.position;
  const w = bb.max.x - bb.min.x, h = bb.max.y - bb.min.y;
  for (let i = 0; i < uv.count; i++)
    uv.setXY(i, (p.getX(i) - bb.min.x) / w, (p.getY(i) - bb.min.y) / h);
  return g;
}

{

    holes.push(lancetPath(cz, 12.5, 13.5, 2.5));
  }
  const g = slabGeo(Z0 - 0.6, Z1 + 0.6, -1.0, WALL_TOP, holes, 0.9);
  g.rotateY(-Math.PI / 2);
  for (let s = -1; s <= 1; s += 2) {

  // clerestory glass, cool and dim — this is side fill, not the key
  const cg = [];
  for (let i = 0; i < BAYS; i++)
    cg.push(glassPane(Z0 + (i + 0.5) * BAY, 12.5, 13.5, 2.5));

  for (let s = -1; s <= 1; s += 2) {
    const m = new THREE.Mesh(cgeo, glassOf(clereGlassTex, 2.0));
    m.position.x = s * (NAVE_W / 2 + 0.87);

}

// ── aisle outer walls with lancets, and the aisle ceiling ──────────
const AISLE_X = NAVE_W / 2 + AISLE_W;

/* ═══════════════════════════════════════════════════════════════════
   RIBBED VAULT — half-arches as cubic Béziers, webs as Coons patches
   over the four boundary curves. The only non-trivial geometry here.
   ═══════════════════════════════════════════════════════════════════ */
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// leaves the springing vertically, arrives at the crown on a slope:
// that slope is what makes it read Gothic rather than Roman
function halfArch(spring, apex) {
  const flat = V(spring.x - apex.x, 0, spring.z - apex.z);
  const rise = apex.y - spring.y;
  const c1 = spring.clone(); c1.y += rise * 0.60;
  const c2 = apex.clone().addScaledVector(flat, 0.32);
  return new THREE.CubicBezierCurve3(spring, c1, c2, apex);
}

/* Coons patch over a triangle: the v = 1 edge collapses onto the
   keystone. eAB runs A→B, dA runs A→K, dB runs B→K.                */
function coonsWeb(eAB, dA, dB, N, lift, hole) {
  const K = dA.getPoint(1);
  const A = eAB.getPoint(0), B = eAB.getPoint(1);
  const pos = [], idx = [], uvs = [];
  const tmp = new THREE.Vector3();
  for (let j = 0; j <= N; j++) {
    const v = j / N;
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const E = eAB.getPoint(u), a = dA.getPoint(v), b = dB.getPoint(v);
      tmp.set(0, 0, 0)
        .addScaledVector(E, 1 - v).addScaledVector(K, v)
        .addScaledVector(a, 1 - u).addScaledVector(b, u)
        .addScaledVector(A, -(1 - u) * (1 - v))
        .addScaledVector(B, -u * (1 - v))
        .addScaledVector(K, -v);
      pos.push(tmp.x, tmp.y + lift, tmp.z);
      uvs.push(u, v);
    }
  }
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1;
    if (hole) {                              // drop the quads that fell in
      const cx = (pos[a * 3] + pos[b * 3] + pos[c * 3] + pos[d * 3]) / 4;
      const cz = (pos[a * 3 + 2] + pos[b * 3 + 2] + pos[c * 3 + 2] + pos[d * 3 + 2]) / 4;
      if (hole(cx, cz)) continue;
    }
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

{
  const H = NAVE_W / 2, ribs = [], webs = [];
  const tube = c => new THREE.TubeGeometry(c, 14, 0.20, 6, false);

  for (let i = 0; i < BAYS; i++) {
    const z0 = Z0 + i * BAY, z1 = z0 + BAY, zc = (z0 + z1) / 2;
    const K = V(0, VAULT_H, zc);                       // keystone
    const A = V(-H, WALL_TOP, z0), B = V(H, WALL_TOP, z0);
    const C = V(H, WALL_TOP, z1),  D = V(-H, WALL_TOP, z1);

    const dA = halfArch(A, K), dB = halfArch(B, K);
    const dC = halfArch(C, K), dD = halfArch(D, K);
    ribs.push(tube(dA), tube(dB), tube(dC), tube(dD));

    // transverse arches at the bay boundaries, longitudinal at the walls
    const tN0 = halfArch(A, V(0, VAULT_H, z0)), tN1 = halfArch(B, V(0, VAULT_H, z0));
    const tS0 = halfArch(D, V(0, VAULT_H, z1)), tS1 = halfArch(C, V(0, VAULT_H, z1));
    const lW0 = halfArch(A, V(-H, VAULT_H, zc)), lW1 = halfArch(D, V(-H, VAULT_H, zc));
    const lE0 = halfArch(B, V(H, VAULT_H, zc)),  lE1 = halfArch(C, V(H, VAULT_H, zc));
    if (i === 0) ribs.push(tube(tN0), tube(tN1));
    ribs.push(tube(tS0), tube(tS1), tube(lW0), tube(lW1), tube(lE0), tube(lE1));

    // a full boundary arch, as one curve A→B, for the Coons edge
    const joinArch = (h0, h1) => {
      const cp = new THREE.CurvePath();
      cp.add(h0);
      cp.add(new THREE.CubicBezierCurve3(h1.v3, h1.v2, h1.v1, h1.v0));
      return cp;
    };

    // the breached bay is tessellated finer so the torn edge reads
    const hit = BREACH.z > z0 - 1 && BREACH.z < z1 + 1;
    const n = hit ? 22 : 9, cut = hit ? inBreach : null;
    webs.push(coonsWeb(joinArch(tN0, tN1), dA, dB, n, 0.16, cut));   // north
    webs.push(coonsWeb(joinArch(tS0, tS1), dD, dC, n, 0.16, cut));   // south
    webs.push(coonsWeb(joinArch(lW0, lW1), dA, dD, n, 0.16, cut));   // west
    webs.push(coonsWeb(joinArch(lE0, lE1), dB, dC, n, 0.16, cut));   // east
  }

  // rubble left clinging to the rim
  const rim = [];
  for (let k = 0; k < 26; k++) {
    const a = (k / 26) * Math.PI * 2;
    const rr = breachRadius(Math.cos(a), Math.sin(a)) * (1.0 + (k % 3) * 0.045);
    const g = new THREE.BoxGeometry(0.30 + (k % 4) * 0.11, 0.22 + (k % 3) * 0.09,
                                    0.26 + (k % 5) * 0.07);
    g.rotateY(a + (k % 7) * 0.21);
    g.rotateX((k % 5 - 2) * 0.16);
    g.translate(BREACH.x + Math.cos(a) * rr, VAULT_H - 0.50 - (k % 4) * 0.16,
                BREACH.z + Math.sin(a) * rr);
    rim.push(g);
  }
  const rimMesh = new THREE.Mesh(mergeGeometries(rim, false), matStone);
  rimMesh.castShadow = rimMesh.receiveShadow = true;
  scene.add(rimMesh);

  /* An overcast sky, hung above the roof. Without it the hole reads as
     a black patch rather than an opening — you need to see what the
     light is coming from.                                          */
  /* Small, and close above the hole. At sixteen metres across and nine
     metres up it hung over the whole building, and looking up anywhere
     near the clerestory you saw it past the edge of the vault — a pale
     shape the size of a bay that read as a second, enormous hole in the
     roof. It only ever needs to be visible through the breach.     */
  const skyDisc = new THREE.Mesh(
    new THREE.CircleGeometry(3.2, 32),
    new THREE.MeshBasicMaterial({ color: 0x9fb6d8, toneMapped: true, fog: false })
  );
  skyDisc.material.color.multiplyScalar(0.95);
  skyDisc.rotation.x = Math.PI / 2;            // facing down into the nave
  skyDisc.position.set(BREACH.x, 23.5, BREACH.z);
  skyDisc.layers.enable(REFLECT_LAYER);
  scene.add(skyDisc);

  const ribMesh = new THREE.Mesh(mergeGeometries(ribs, false), matStone);
  ribMesh.castShadow = ribMesh.receiveShadow = true;
  scene.add(ribMesh);

  const webMesh = new THREE.Mesh(mergeGeometries(webs, false), matVault);
  // the webs must cast: without this the breach light goes straight
  // through the whole ceiling and lands as a disc on the floor
  webMesh.castShadow = true;
  webMesh.receiveShadow = true;
  scene.add(webMesh);
}

/* ═══════════════════════════════════════════════════════════════════
   LIGHT — one key, projected through the rose. Everything else is fill.
   ═══════════════════════════════════════════════════════════════════ */
/* Intensity note: the brief's 2 000 000 cd is a real photometric value,
   but bloom runs before tone mapping, so its 0.85 threshold only means
   anything if scene radiance sits around 1.0. Rather than crush
   exposure to ~0.006 and blow the whole bloom pass out, the same image
   is reached by keeping exposure at 1.0 and putting the light in the
   renderer's normalised range. Same picture, working bloom.          */
/* Decay 1, not 2. A rose window is nine metres across — it is an area
   source, and inverse-square is the falloff of a point. Over a fifty
   metre nave the difference is not subtle: at decay 2 the floor twenty
   metres from the beam took four times what the far end did, so a
   single pane of dark glass landed near the camera at three times over
   white. AgX rolls anything that far over-range toward white, which is
   why it read as a lamp lying in the water rather than as coloured
   light. At decay 1 that ratio halves, the far end gains, and the
   intensity number drops accordingly — it is no longer candela and is
   not pretending to be.                                            */
const ROSE_DECAY = 1.0;
const spot = new THREE.SpotLight(0xffffff, 650, 0, 0.42, 0.15, ROSE_DECAY);
spot.position.set(0, 17, -34);
spot.target.position.set(0, 3, 10);
spot.map = roseTex;
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
spot.shadow.bias = -0.0008;
spot.shadow.normalBias = 0.02;
spot.shadow.camera.near = 6;
spot.shadow.camera.far = 78;
scene.add(spot, spot.target);
proj.uSpotMat.value = spot.shadow.matrix;
// lights are layer-tested like any other object: without this the
// mirror camera renders an unlit scene
spot.layers.enable(REFLECT_LAYER);
hemi.layers.enable(REFLECT_LAYER);

/* Daylight through the breach. A narrow cone straight down, casting
   shadows — the torn edge of the web is what shapes the beam, so the
   shaft arrives with the same ragged outline as the hole itself.   */
// daylight from outside is as close to parallel as anything here gets
const sky = new THREE.SpotLight(0xd7e4ff, 175, 0, 0.12, 0.35, ROSE_DECAY);
sky.position.set(BREACH.x, 46, BREACH.z);
sky.target.position.set(BREACH.x, 0, BREACH.z);
sky.castShadow = true;
sky.shadow.mapSize.set(1024, 1024);
sky.shadow.bias = -0.0009;
sky.shadow.normalBias = 0.02;
sky.shadow.camera.near = 18;
sky.shadow.camera.far = 62;
sky.layers.enable(REFLECT_LAYER);
scene.add(sky, sky.target);

// side fill through the aisle lancets: same trick, 20× weaker, no shadows
const fillLights = [];
for (let s = -1; s <= 1; s += 2) for (let k = 0; k < 2; k++) {
  const z = Z0 + (k * 2 + 1.6) * BAY;
  const f = new THREE.SpotLight(0xffffff, 70, 0, 0.72, 0.6, ROSE_DECAY);
  f.map = aisleGlassTex;                 // the side lights are projected too
  f.position.set(s * (AISLE_X + 7), 9.5, z);
  f.target.position.set(s * -1, 3.5, z + 3);
  f.layers.enable(REFLECT_LAYER);

  scene.add(f, f.target);

/* ═══════════════════════════════════════════════════════════════════
   CAMERA — a fixed slow path, 90 s per loop, crossing the waterline
   ═══════════════════════════════════════════════════════════════════ */
const PATH = new THREE.CatmullRomCurve3([
  V( 1.6, 5.05,  18.5),
  V(-1.1, 4.20,  13.0),
  V( 1.9, 3.62,   7.4),
  V(-0.6, 4.20,   1.6),
  V( 1.3, 5.15,  -4.2),
  V(-1.7, 4.20,  -9.6),
  V( 0.9, 3.70, -14.4),
  V(-0.5, 4.55, -18.6)
], false, 'catmullrom', 0.5);

const LOOP_T = 90;
let clock = new THREE.Clock();
let paused = false, tPath = 0;
const mouse = new THREE.Vector2(), mouseS = new THREE.Vector2();

addEventListener('mousemove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1);
});
addEventListener('keydown', e => {
  if (e.code === 'Space' && cfg.camera.mode !== 'free') paused = !paused;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  onResize();
});
let onResize = () => {};

/* ── moving around ─────────────────────────────────────────────────
   Two ways to look: drag the mouse, or click for a pointer lock. Any
   movement key drops you straight out of the scripted path, so you do
   not have to know about the mode toggle to start walking.         */
const keys = Object.create(null);
const fly = { yaw: Math.PI, pitch: 0, speed: 6.0, locked: false, dragging: false };
const _dir = new THREE.Vector3(), _right = new THREE.Vector3();
const _euler = new THREE.Euler(0, 0, 0, 'YXZ');
const MOVE_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE',
                   'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

// typing a value or arrowing through a dropdown in the panel must not
// also drive the camera
const inPanel = e => {
  const t = e.target;
  return !!t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' ||
                 t.tagName === 'TEXTAREA' || t.isContentEditable === true);
};

addEventListener('keydown', e => {
  if (inPanel(e)) return;
  keys[e.code] = true;
  if (e.code === 'KeyF') setMode(cfg.camera.mode === 'free' ? 'cinematic' : 'free');
  else if (e.code === 'KeyP') togglePhoto();
  else if (e.code === 'Enter') shoot();
  else if (e.code === 'KeyH' && gui) gui.show(gui._hidden);
  else if (MOVE_KEYS.includes(e.code) && cfg.camera.mode !== 'free') setMode('free');
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const cv = renderer.domElement;
cv.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (cfg.camera.mode !== 'free') setMode('free');
  fly.dragging = true;
  cv.style.cursor = 'grabbing';
});
addEventListener('mouseup', () => { fly.dragging = false; cv.style.cursor = ''; });
cv.addEventListener('dblclick', () => {
  if (cfg.camera.mode === 'free') cv.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  fly.locked = document.pointerLockElement === cv;
});
cv.addEventListener('wheel', e => {
  if (cfg.camera.mode !== 'free') return;
  fly.speed = THREE.MathUtils.clamp(fly.speed * (e.deltaY > 0 ? 0.86 : 1.16), 0.5, 40);
  guiRefresh();
  e.preventDefault();
}, { passive: false });

addEventListener('mousemove', e => {
  if (cfg.camera.mode !== 'free' || !(fly.locked || fly.dragging)) return;
  fly.yaw   -= e.movementX * 0.0024;
  fly.pitch  = THREE.MathUtils.clamp(fly.pitch - e.movementY * 0.0024, -1.5, 1.5);
});

const HUD_FREE = 'wasd — move · q/e — up/down · shift — faster · wheel — speed · '
               + 'drag or double-click — look · f — cinematic · h — panel';
const HUD_CINE = 'click for sound · space — pause · mouse — look · wasd or f — walk in · h — panel';

function setMode(m) {
  cfg.camera.mode = m;
  if (m === 'free') {
    _euler.setFromQuaternion(camera.quaternion);
    fly.yaw = _euler.y; fly.pitch = _euler.x;
    hud.textContent = HUD_FREE;
    cv.style.cursor = 'grab';
  } else {
    document.exitPointerLock?.();
    hud.textContent = HUD_CINE;
    cv.style.cursor = '';
  }
  guiRefresh();
  saveSoon();
}

// keep the camera inside the building — outside it there is only black
function clampToScene(p) {
  const m = 0.6;
  p.x = THREE.MathUtils.clamp(p.x, -AISLE_X + m, AISLE_X - m);
  p.z = THREE.MathUtils.clamp(p.z, Z0 + m, Z1 - m);
  p.y = THREE.MathUtils.clamp(p.y, 0.5, VAULT_H - 1.2);
}

const lookTmp = new THREE.Vector3(), posTmp = new THREE.Vector3();
function driveCamera(dt) {
  if (cfg.camera.mode === 'free') {
    camera.quaternion.setFromEuler(_euler.set(fly.pitch, fly.yaw, 0));
    const v = fly.speed * (keys.ShiftLeft || keys.ShiftRight ? 3.5 : 1) * dt;
    camera.getWorldDirection(_dir);
    if (cfg.camera.walk) _dir.y = 0;                 // stay level when walking
    _dir.normalize();
    _right.crossVectors(_dir, camera.up).normalize();
    if (keys.KeyW || keys.ArrowUp)    camera.position.addScaledVector(_dir, v);
    if (keys.KeyS || keys.ArrowDown)  camera.position.addScaledVector(_dir, -v);
    if (keys.KeyD || keys.ArrowRight) camera.position.addScaledVector(_right, v);
    if (keys.KeyA || keys.ArrowLeft)  camera.position.addScaledVector(_right, -v);
    if (keys.KeyE || keys.Space)      camera.position.y += v;
    if (keys.KeyQ || keys.ControlLeft) camera.position.y -= v;
    if (cfg.camera.walk)
      camera.position.y += (cfg.camera.eye - camera.position.y) * Math.min(1, dt * 6);
    if (cfg.camera.bounds) clampToScene(camera.position);
    return;
  }

  if (!paused) tPath = (tPath + dt / (LOOP_T / cfg.camera.speed)) % 1;
  const u = tPath;
  PATH.getPointAt(u, posTmp);
  camera.position.copy(posTmp);

  // always toward the rose, with a slow drift, then ±15° of mouse
  const drift = Math.sin(u * Math.PI * 2 * 2.0) * 0.14;
  lookTmp.set(ROSE_C.x + drift * 9, ROSE_C.y - 5.5 + Math.sin(u * 12.6) * 1.2, ROSE_C.z + 2);
  camera.lookAt(lookTmp);
  mouseS.lerp(mouse, 0.045);
  const lim = THREE.MathUtils.degToRad(cfg.camera.look);
  camera.rotateY(-mouseS.x * lim);
  camera.rotateX(-mouseS.y * lim * 0.72);
}

/* ═══════════════════════════════════════════════════════════════════
   WATER — Gerstner displacement, planar reflection, analytic refraction
   ═══════════════════════════════════════════════════════════════════ */
let REFL_SCALE = 0.5;                        // half res: ripples hide it
const reflRT = new THREE.WebGLRenderTarget(1, 1, {
  type: THREE.HalfFloatType, minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter, depthBuffer: true
});
const reflCam = new THREE.PerspectiveCamera();
reflCam.layers.set(REFLECT_LAYER);
const reflMatrix = new THREE.Matrix4();
const clipAbove = new THREE.Plane(new THREE.Vector3(0, 1, 0), -WATER_Y);

const waterUniforms = {
  uTime,
  uRefl:       { value: reflRT.texture },
  uReflMat:    { value: reflMatrix },
  uCaustics:   { value: causticsTex },
  uRipple:     { value: stoneNormal },
  uFloor:      { value: floorTex },
  uSpotMat:    proj.uSpotMat,
  uSpotMap:    { value: roseTex },
  uSpotShadow: proj.uSpotShadow,
  uCam:        { value: new THREE.Vector3() },
  uWaterY:     { value: WATER_Y },
  uDeep:       { value: new THREE.Color(0x0a2836) },
  uUnder:      { value: 0 },
  uCaustic:    proj.uCaustic,
  uWave:       { value: new THREE.Vector4(1.0, 1.0, 1.0, 0.16) }, // amp, steep, speed, detail
  uAbsorb:     { value: 0.040 },
  // ring buffer of drip impacts: xz = where, z = when, w = strength
  uRipples:    { value: Array.from({ length: 12 }, () => new THREE.Vector4(0, 0, -99, 0)) },
  // rgb = the scene behind the water, a = its linear depth over far
  uRefract:    { value: null },
  uRes:        { value: new THREE.Vector2(1, 1) },
  uFar:        { value: 220 },
  uRefr:       { value: 0.055 }
};

const waterMat = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    uniform float uTime, uWaterY;
    uniform mat4  uReflMat;
    uniform vec4  uWave;
    uniform vec3  uCam;
    uniform vec4  uRipples[12];
    varying vec3 vW;
    varying vec3 vN;
    varying vec4 vReflUV;
    varying float vViewZ;

    const float G = 9.81;
    // dir.xy, wavelength, amplitude — descending, total steepness ≤ 0.10
    ${WAVE_GLSL}

    void gerstner(vec4 w, vec2 p, float t, inout vec3 disp, inout vec3 nrm) {
      vec2  d = normalize(w.xy);
      float k = 6.2831853 / w.z;
      float a = w.w * uWave.x;
      float om = sqrt(G * k);
      float q  = min(1.0, (0.10 * uWave.y) / (4.0 * k * max(a, 1e-5)));
      float ph = k * dot(d, p) - om * t;
      float c = cos(ph), s = sin(ph);
      disp += vec3(q * a * d.x * c, a * s, q * a * d.y * c);
      float wa = k * a;
      nrm += vec3(-d.x * wa * c, -q * wa * s, -d.y * wa * c);
    }

    void main() {
      vec3 p = position;                       // plane already lies in XZ
      vec3 disp = vec3(0.0), acc = vec3(0.0);
      vec3 wp0 = (modelMatrix * vec4(p, 1.0)).xyz;
      float t = uTime * uWave.z;
      gerstner(W0, wp0.xz, t, disp, acc);
      gerstner(W1, wp0.xz, t, disp, acc);
      gerstner(W2, wp0.xz, t, disp, acc);
      gerstner(W3, wp0.xz, t, disp, acc);
      // When the eye sits on the waterline, a crest 2 cm high swamps the
      // frame and smears the grazing reflection across it. Flatten the
      // surface in a small disc around the camera — only while it is in
      // that band, and only where no detail could be resolved anyway.
      float near = smoothstep(0.0, 3.5, length(wp0.xz - uCam.xz));
      float band = 1.0 - smoothstep(0.35, 0.90, abs(uCam.y - uWaterY));
      float taper = mix(1.0, near, band);
      disp *= taper;
      acc  *= taper;

      // drip impacts: an outgoing ring, decaying in age and in radius
      for (int i = 0; i < 12; i++) {
        vec4 rp = uRipples[i];
        float age = uTime - rp.z;
        if (age < 0.0 || age > 3.4 || rp.w <= 0.0) continue;
        vec2  d2 = wp0.xz - rp.xy;
        float d  = length(d2);
        float front = age * 1.35;                    // ring radius
        float env = exp(-abs(d - front) * 3.6) * exp(-age * 1.05) * exp(-d * 0.30);
        float phase = (d - front) * 13.0;
        disp.y += rp.w * 0.048 * env * cos(phase);
        vec2 g = (d > 1e-4 ? d2 / d : vec2(0.0)) * rp.w * 0.62 * env * sin(phase);
        acc.x -= g.x;
        acc.z -= g.y;
      }

      vec3 wp = wp0 + disp;
      vN = normalize(vec3(acc.x, 1.0 + acc.y, acc.z));
      vW = wp;
      vReflUV = uReflMat * vec4(wp, 1.0);
      vec4 mv = viewMatrix * vec4(wp, 1.0);
      vViewZ = -mv.z;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D uRefl, uCaustics, uRipple, uFloor, uSpotMap, uSpotShadow, uRefract;
    uniform mat4  uSpotMat;
    uniform vec3  uCam, uDeep, uCaustic;
    uniform vec4  uWave;
    uniform vec2  uRes;
    uniform float uTime, uWaterY, uUnder, uAbsorb, uFar, uRefr;
    varying vec3 vW;
    varying vec3 vN;
    varying vec4 vReflUV;
    varying float vViewZ;

    #include <packing>

    vec3 roseAtW(vec3 wp) {
      vec4 sp = uSpotMat * vec4(wp, 1.0);
      if (sp.w <= 0.0) return vec3(0.0);
      vec3 c = sp.xyz / sp.w;
      if (any(lessThan(c.xy, vec2(0.001))) || any(greaterThan(c.xy, vec2(0.999)))) return vec3(0.0);
      float sd = unpackRGBAToDepth(texture2D(uSpotShadow, c.xy));
      float vis = step(c.z - 0.004, sd);
      return texture2D(uSpotMap, c.xy).rgb * vis;
    }
    float caustic(vec2 xz) {
      float t = uTime * uCaustic.z;
      vec2 s = xz * uCaustic.y;
      float c = texture2D(uCaustics, s * 0.25 + t * vec2( 0.014, 0.009)).r
              * texture2D(uCaustics, s * 0.41 - t * vec2( 0.011, 0.017)).r;
      return pow(c, 0.75) * uCaustic.x;
    }

    void main() {
      vec3 V = normalize(uCam - vW);
      vec3 N = normalize(vN);

      // two scrolling fine-scale layers, highlights only
      vec3 d1 = texture2D(uRipple, vW.xz * 0.22 + uTime * vec2(0.020, 0.013)).xyz * 2.0 - 1.0;
      vec3 d2 = texture2D(uRipple, vW.xz * 0.55 - uTime * vec2(0.016, 0.024)).xyz * 2.0 - 1.0;
      N = normalize(N + vec3(d1.x + d2.x, 0.0, d1.y + d2.y) * uWave.w);
      if (uUnder > 0.5) N = -N;

      float F = 0.02 + 0.98 * pow(1.0 - max(dot(V, N), 0.0), 5.0);

      // reflection, offset along the surface normal
      vec2 ruv = vReflUV.xy / max(vReflUV.w, 1e-4) + N.xz * 0.055;
      vec3 reflectColor = texture2D(uRefl, clamp(ruv, 0.001, 0.999)).rgb
                        + vec3(0.010, 0.014, 0.021);

      /* Refraction is screen space now: the scene was rendered once
         without the water and handed here as colour plus linear depth.
         So anything submerged — floor, column bases, the caustics
         already baked onto them — shows through properly, and the
         distance the light travelled through water falls out of the
         depth difference instead of a plane intersection.          */
      vec2 suv = gl_FragCoord.xy / uRes;
      vec2 off = N.xz * uRefr / (1.0 + vViewZ * 0.05);
      vec2 ruv2 = clamp(suv + off, vec2(0.002), vec2(0.998));
      vec4 back = texture2D(uRefract, ruv2);
      // a sample nearer than the surface is geometry in front of the
      // water bleeding in — fall back to the undistorted pixel
      if (back.a * uFar < vViewZ) { ruv2 = suv; back = texture2D(uRefract, suv); }
      float travel = max(0.0, back.a * uFar - vViewZ) * 1.12;
      vec3 refractColor = mix(back.rgb * 1.85, uDeep * 0.6, 1.0 - exp(-travel * uAbsorb));

      vec3 col;
      if (uUnder > 0.5) {
        /* From underneath, the surface is not a mirror and not a window
           — it is both, split at the critical angle. Everything above
           the water arrives through a cone about 48.7° wide; outside it
           the surface reflects the flooded nave back at you.        */
        float up = clamp(-V.y, 0.0, 1.0);
        float window = smoothstep(0.56, 0.74, up);
        // through the window you see the real thing, not a mirror of it
        vec3 above = back.rgb * 1.15 + vec3(0.016, 0.022, 0.030);
        vec3 tir = uDeep * 1.20
                 + caustic(vW.xz) * roseAtW(vW) * uDeep * 2.2
                 + reflectColor * 0.09;
        col = mix(tir, above, window);
      } else {
        col = mix(refractColor, reflectColor, F);
      }
      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const waterGeo = new THREE.PlaneGeometry(28, (Z1 - Z0) + 6, 400, 400);
waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, waterMat);

function sizeReflect() {
  reflRT.setSize(Math.max(2, Math.floor(innerWidth * REFL_SCALE)),
                 Math.max(2, Math.floor(innerHeight * REFL_SCALE)));

const _fwd = new THREE.Vector3(), _tgt = new THREE.Vector3(), _up = new THREE.Vector3();
function renderReflection() {
  const h = water.position.y;
  reflCam.copy(camera, false);
  reflCam.layers.set(REFLECT_LAYER);
  reflCam.position.set(camera.position.x, 2 * h - camera.position.y, camera.position.z);
  camera.getWorldDirection(_fwd);
  _tgt.copy(camera.position).add(_fwd);
  _tgt.y = 2 * h - _tgt.y;
  _up.set(0, 1, 0).applyQuaternion(camera.quaternion);
  _up.y = -_up.y;
  reflCam.up.copy(_up);
  reflCam.lookAt(_tgt);
  reflCam.projectionMatrix.copy(camera.projectionMatrix);
  reflCam.updateMatrixWorld(true);
  reflCam.matrixWorldInverse.copy(reflCam.matrixWorld).invert();

  reflMatrix.set(0.5, 0, 0, 0.5,  0, 0.5, 0, 0.5,  0, 0, 0.5, 0.5,  0, 0, 0, 1);

  reflMatrix.multiply(reflCam.matrixWorldInverse);

  water.visible = false;
  renderer.clippingPlanes = [clipAbove];
  const prevTarget = renderer.getRenderTarget();
  renderer.setRenderTarget(reflRT);
  renderer.clear();
  renderer.render(scene, reflCam);
  renderer.setRenderTarget(prevTarget);
  renderer.clippingPlanes = [];
  water.visible = true;
}

/* ═══════════════════════════════════════════════════════════════════
   SOUND — synthesised, like everything else here. Noise shaped into
   water, a plink per real drip impact, and a convolution reverb whose
   impulse response is generated rather than recorded: sparse early
   reflections off the arcade, then a long stone tail.
   Browsers will not start audio without a gesture, so the graph is
   built on the first click or key.
   ═══════════════════════════════════════════════════════════════════ */
const audio = (() => {
  let ctx = null, master, dryG, wetG, lp, waterG, dripBus, lfoGain, noiseBuf;
  let ready = false, nextLap = 0;

  function noiseBuffer(sec) {
    const n = ctx.sampleRate * sec, b = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < n; i++) {                 // pink-ish: one-pole on white
      const w = Math.random() * 2 - 1;
      last = (last * 0.86 + w * 0.14);
      d[i] = last * 3.2;
    }
    return b;
  }

  // a nave is long, hard and mostly empty: late reverb of several seconds
  function impulse(sec, decay) {
    const n = Math.floor(ctx.sampleRate * sec);
    const b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < n; i++) {
        const t = i / n;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (t < 0.004 ? 0.3 : 1);
      }
      for (let k = 0; k < 20; k++) {              // discrete slaps off the arcade
        const p = Math.floor(ctx.sampleRate * (0.011 + k * 0.0075 + Math.random() * 0.02));
        if (p < n) d[p] += (Math.random() * 2 - 1) * 0.5 * Math.pow(1 - k / 20, 1.5);
      }
    }
    return b;
  }

  function build() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();

    master = ctx.createGain();  master.gain.value = 0;
    lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 18000;
    master.connect(lp); lp.connect(ctx.destination);

    const conv = ctx.createConvolver();
    conv.buffer = impulse(4.6, 2.6);
    dryG = ctx.createGain(); dryG.gain.value = 0.62;
    wetG = ctx.createGain(); wetG.gain.value = 0.85;
    conv.connect(wetG);
    dryG.connect(master); wetG.connect(master);

    const bus = ctx.createGain();
    bus.connect(dryG); bus.connect(conv);
    dripBus = bus;

    /* Water indoors is not surf. A broad noise band reads as a beach,
       so the bed is narrow, low and almost inaudible — the audible part
       is sparse laps against the stone, scheduled rather than sustained,
       and it is mostly the reverb tail you actually hear.            */
    noiseBuf = noiseBuffer(4);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 190; bp.Q.value = 1.7;
    const low = ctx.createBiquadFilter(); low.type = 'lowpass'; low.frequency.value = 110;
    waterG = ctx.createGain(); waterG.gain.value = 0.04;
    const lowG = ctx.createGain(); lowG.gain.value = 0.18;
    src.connect(bp); bp.connect(waterG);
    src.connect(low); low.connect(lowG); lowG.connect(waterG);
    waterG.connect(dryG); waterG.connect(conv);

    // the bed wanders instead of sitting on one note
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.061;
    const lfo2 = ctx.createOscillator(); lfo2.frequency.value = 0.029;
    lfoGain = ctx.createGain(); lfoGain.gain.value = 42;
    lfo.connect(lfoGain); lfo2.connect(lfoGain);
    lfoGain.connect(bp.frequency);
    lfo.start(); lfo2.start(); src.start();

    ready = true;
  }

  // one soft lap of water against stone
  function lap(t) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    s.loop = true;
    s.playbackRate.value = 0.5 + Math.random() * 0.4;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = 240 + Math.random() * 260; f.Q.value = 1.1;
    const g = ctx.createGain();
    const v = 0.035 * cfg.audio.water / 0.04;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + 0.09 + Math.random() * 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55 + Math.random() * 0.5);
    const p = ctx.createStereoPanner();
    p.pan.value = Math.random() * 1.5 - 0.75;
    s.connect(f); f.connect(g); g.connect(p); p.connect(dripBus);
    s.start(t); s.stop(t + 1.3);
  }

  function unlock() {
    build();
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  return {
    unlock,
    get on() { return ready; },
    /* A drop is not a falling pitch — that is a laser. What you hear is
       the bubble left behind by the impact, and as it shrinks its
       resonance goes UP. So: a very short broadband tick for the strike,
       then a short sine rising by a few semitones and dying fast.    */
    drip(x, z, amp) {
      if (!ready || !cfg.audio.on) return;
      const t = ctx.currentTime;
      const dx = x - camera.position.x, dz = z - camera.position.z;
      const dist = Math.hypot(dx, dz);
      const v = amp * cfg.audio.drips * 0.42 / (1 + dist * 0.22);
      if (v < 0.0005) return;

      const p = ctx.createStereoPanner();
      const right = new THREE.Vector3();
      camera.getWorldDirection(right);
      right.cross(camera.up).normalize();
      p.pan.value = THREE.MathUtils.clamp((dx * right.x + dz * right.z) / (dist + 0.6), -0.9, 0.9);
      p.connect(dripBus);

      const rnd = Math.abs(Math.sin(x * 12.9898 + z * 78.233) * 43758.5453) % 1;
      const f0 = 620 + rnd * 1500;

      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f0 * (1.13 + rnd * 0.16), t + 0.045);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.10 + rnd * 0.06);
      o.connect(g); g.connect(p);
      o.start(t); o.stop(t + 0.20);

      const n = ctx.createBufferSource(); n.buffer = noiseBuf;
      n.playbackRate.value = 1.6;
      const nf = ctx.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 1800;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(v * 0.5, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.018);
      n.connect(nf); nf.connect(ng); ng.connect(p);
      n.start(t); n.stop(t + 0.05);
    },
    update(under) {
      if (!ready) return;
      const a = cfg.audio;
      const t = ctx.currentTime;
      master.gain.setTargetAtTime(a.on ? a.master : 0, t, 0.15);
      waterG.gain.setTargetAtTime(a.water * (under > 0.5 ? 1.9 : 1.0), t, 0.25);
      if (a.on && a.water > 0.001 && under < 0.5 && t > nextLap) {
        if (nextLap > 0) lap(t + 0.02);
        nextLap = t + 1.8 + Math.random() * 4.2;
      }
      wetG.gain.setTargetAtTime(a.reverb, t, 0.2);
      // under the surface everything above it goes muffled
      lp.frequency.setTargetAtTime(under > 0.5 ? 420 : 18000, t, 0.18);
    }
  };
})();
addEventListener('pointerdown', () => audio.unlock(), { once: true });
addEventListener('keydown', () => audio.unlock(), { once: true });

/* ═══════════════════════════════════════════════════════════════════
   WHAT IS STILL LIVING IN HERE — drowned oak, votive candles, and the
   slow drip off the vault. All of it floats on the same wave field the
   water shader solves, so nothing skates over the surface.
   ═══════════════════════════════════════════════════════════════════ */
function makeWoodTexture(S = 512) {
  const cv = makeCanvas(S), g = cv.getContext('2d');
  const img = g.createImageData(S, S), d = img.data;
  const hash = (x, y, s) => {
    let h = (x * 2654435761 + y * 340573321 + s * 1103515245) | 0;
    h = (h ^ (h >> 14)) * 2246822519 | 0;
    return ((h ^ (h >> 13)) >>> 0) / 4294967296;
  };
  const sm = t => t * t * (3 - 2 * t);
  const vn = (u, v, nx, ny, s) => {
    const fx = u * nx, fy = v * ny;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = sm(fx - x0), ty = sm(fy - y0);
    const w = (a, b) => hash(((a % nx) + nx) % nx, ((b % ny) + ny) % ny, s);
    return (w(x0, y0) * (1 - tx) + w(x0 + 1, y0) * tx) * (1 - ty)
         + (w(x0, y0 + 1) * (1 - tx) + w(x0 + 1, y0 + 1) * tx) * ty;
  };
  // grain runs along v; rings are bands across u, wobbled by the grain
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const u = x / S, v = y / S;
    const grain = vn(u, v, 6, 2, 5) * 0.6 + vn(u, v, 22, 3, 9) * 0.3 + vn(u, v, 90, 12, 13) * 0.1;
    const rings = Math.sin(Math.PI * 2 * (u * 9 + grain * 2.1)) * 0.5 + 0.5;
    const fibre = vn(u, v, 160, 5, 17);
    let t = rings * 0.62 + fibre * 0.22 + grain * 0.16;
    const plank = Math.floor(v * 4);                       // four boards
    t *= 0.86 + hash(plank, 3, 31) * 0.28;
    const seam = Math.abs((v * 4) % 1 - 0.5) > 0.482 ? 0.42 : 1.0;
    const i = (y * S + x) * 4;
    d[i]     = (74 + t * 128) * seam;
    d[i + 1] = (49 + t * 90) * seam;
    d[i + 2] = (31 + t * 55) * seam;
    d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function radialSprite(S, stops) {
  const cv = makeCanvas(S), g = cv.getContext('2d');
  const grd = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  stops.forEach(([o, c]) => grd.addColorStop(o, c));
  g.fillStyle = grd; g.fillRect(0, 0, S, S);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const woodTex = makeWoodTexture();
const matWood = injectStone(new THREE.MeshStandardMaterial({

/* ── pews: drowned oak, still floating ─────────────────────────────*/
function pewGeometry() {
  const parts = [];
  const add = (w, h, d, x, y, z, rx = 0) => {
    const g = new THREE.BoxGeometry(w, h, d);
    if (rx) g.rotateX(rx);
    g.translate(x, y, z);
    parts.push(g);
  };
  add(2.70, 0.075, 0.44,  0, 0.00,  0.00);            // seat
  add(2.70, 0.46,  0.065, 0, 0.30, -0.20, -0.16);     // back
  add(2.70, 0.10,  0.10,  0, -0.16, 0.16);            // rail
  add(0.085, 0.62, 0.46, -1.31, -0.02, 0);            // ends
  add(0.085, 0.62, 0.46,  1.31, -0.02, 0);
  const geo = mergeGeometries(parts, false);
  geo.computeVertexNormals();
  return geo;
}

  x: -6.4 + ((i * 4.7) % 12.4) + (i % 3) * 0.6,
  z: Z0 + 5 + ((i * 6.3) % (Z1 - Z0 - 9)),
  rot: (i * 1.37) % (Math.PI * 2),
  spin: ((i % 5) - 2) * 0.004,
  lift: 0.30 + (i % 4) * 0.035          // riding high, the way waterlogged oak does

/* ── candles: floating votives, the only warm light in the building ─*/

const candleGeo = new THREE.CylinderGeometry(0.042, 0.046, 0.15, 8, 1);
candleGeo.translate(0, 0.075, 0);
